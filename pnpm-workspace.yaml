packages:
  - 'packages/*'
  - 'examples'
  - 'docs'

catalog:
  # Test tooling — used across all packages
  vitest: ^5.1.0
  '@vitest/coverage-v8': ^5.1.0

  # TypeScript
  typescript: ^6.0.3

  # Node types
  '@types/node': ^26.6.6

  # OpenAPI
  openapi-types: ^12.1.3

  # Property-based testing
  fast-check: ^4.10.2

  # Formatter
  prettier: ^3.9.10

  # Bundler (CLI packages)
  esbuild: ^0.28.2

  # Mutation testing
  '@stryker-mutator/core': ^10.1.1
  '@stryker-mutator/vitest-runner': ^10.1.1

  # ESLint (integration lint)
  eslint: ^10.14.0
  '@typescript-eslint/eslint-plugin': ^8.72.1
  '@typescript-eslint/parser': ^8.72.1

  # Zod (examples)
  zod: ^4.6.7

  # React ecosystem (integration + petstore)
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@tanstack/react-query': ^5.105.3
