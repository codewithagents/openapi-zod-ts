name: Mutation Testing

# Mutation runs are slow, so they do not gate every PR. They run weekly and on
# demand, and enforce each package's Stryker `thresholds.break` (a score below
# break fails the job). This is the real "mutation testing across all four
# packages" gate.
on:
  schedule:
    - cron: '0 5 * * 1' # Weekly Monday 5am UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    name: Mutation (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - openapi-zod-ts
          - '@codewithagents/openapi-react-query'
          - '@codewithagents/openapi-server'
          - '@codewithagents/api-errors'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Mutation test (enforces thresholds.break)
        run: pnpm --filter ${{ matrix.package }} run test:mutation
