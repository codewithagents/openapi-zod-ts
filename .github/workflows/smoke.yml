name: Smoke Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0' # Weekly Sunday 4am UTC — low-traffic time for free APIs
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke Tests (real HTTP)
    runs-on: ubuntu-latest
    # Smoke tests hit free public APIs that may occasionally be down.
    # The job is allowed to fail without blocking anything — but GitHub will still
    # send a failure email to repo watchers when the scheduled run fails, which is
    # exactly the notification we want.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run smoke tests
        run: pnpm smoke
