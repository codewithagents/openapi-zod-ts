name: Smoke Tests

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0' # Weekly Sunday 4am UTC — low-traffic time for free APIs
  workflow_dispatch: # Manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke Tests (real HTTP)
    runs-on: ubuntu-latest
    # Smoke tests hit free public APIs that may occasionally be down.
    # The job is allowed to fail without blocking anything — but GitHub will still
    # send a failure email to repo watchers when the scheduled run fails, which is
    # exactly the notification we want.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run smoke tests
        run: pnpm smoke
